openapi: 3.0.3
info:
  title: ЯЕда — API для Telegram-бота
  version: 0.1.0
  description: Контракт бэкенда. Для избранного user_id берётся из события Telegram.
servers:
  - url: http://127.0.0.1:8080
    description: Локальный бэкенд
security:
  - BotApiKey: []
paths:
  /healthcheck:
    get:
      operationId: healthCheck
      summary: Проверить состояние бэкенда
      security: []
      responses:
        '200':
          description: Бэкенд доступен
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [ok]}
  /recipes/search:
    get:
      operationId: searchRecipes
      summary: Найти рецепты
      description: Укажите хотя бы один параметр. Список ингредиентов разделяется запятыми.
      parameters:
        - name: ingredients
          in: query
          schema: {$ref: '#/components/schemas/SearchText'}
          example: куриное филе, лапша
        - name: dish_description
          in: query
          schema: {$ref: '#/components/schemas/SearchText'}
          example: омлет
        - name: taste_description
          in: query
          schema: {$ref: '#/components/schemas/SearchText'}
          example: острое
      responses:
        '200': {$ref: '#/components/responses/Recipes'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /recipes/generate:
    post:
      operationId: generateRecipe
      summary: Сгенерировать и сохранить рецепт
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dish_description]
              properties:
                dish_description: {$ref: '#/components/schemas/SearchText'}
            example: {dish_description: рис с овощами}
      responses:
        '200': {$ref: '#/components/responses/Recipe'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /recipes/{recipe_id}:
    parameters:
      - $ref: '#/components/parameters/RecipeId'
    get:
      operationId: getRecipe
      summary: Получить рецепт по ID
      responses:
        '200': {$ref: '#/components/responses/Recipe'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /fav:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listFavorites
      summary: Получить избранное пользователя
      responses:
        '200': {$ref: '#/components/responses/Recipes'}
        '400': {$ref: '#/components/responses/BadRequest'}
  /fav/{recipe_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/RecipeId'
    put:
      operationId: saveFavorite
      summary: Сохранить рецепт в избранное
      responses:
        '200':
          description: Рецепт сохранён или уже был сохранён
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FavoriteStatus'}
              example: {is_favorite: true}
        '400': {$ref: '#/components/responses/BadRequest'}
    delete:
      operationId: removeFavorite
      summary: Удалить рецепт из избранного
      responses:
        '200':
          description: Рецепта больше нет в избранном
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FavoriteStatus'}
              example: {is_favorite: false}
        '400': {$ref: '#/components/responses/BadRequest'}
components:
  securitySchemes:
    BotApiKey:
      type: apiKey
      name: X-API-Key
      in: header
  parameters:
    UserId:
      name: user_id
      in: query
      required: true
      schema: {type: integer, format: int64, minimum: 1, maximum: 9223372036854775807}
    RecipeId:
      name: recipe_id
      in: path
      required: true
      schema: {type: string, minLength: 1, pattern: '\S'}
  responses:
    Recipe:
      description: Рецепт
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Recipe'}
    Recipes:
      description: Список рецептов, возможно пустой
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items: {$ref: '#/components/schemas/Recipe'}
    BadRequest:
      description: Ошибка запроса, доступа или обработки
      content:
        application/json:
          schema:
            type: object
            required: [message, request_id]
            properties:
              message: {type: string}
              request_id: {type: string}
  schemas:
    SearchText:
      type: string
      minLength: 1
      maxLength: 2000
      pattern: '\S'
    Recipe:
      type: object
      required: [id, title, ingredients, steps, description, taste_tags, dish_type]
      properties:
        id: {type: string}
        title: {type: string}
        ingredients:
          type: array
          minItems: 1
          items: {type: string}
        steps:
          type: array
          minItems: 1
          items: {type: string}
        description: {type: string}
        taste_tags:
          type: array
          items: {type: string}
        dish_type: {type: string, nullable: true}
    FavoriteStatus:
      type: object
      required: [is_favorite]
      properties:
        is_favorite: {type: boolean}
