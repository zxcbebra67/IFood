openapi: 3.0.3
info:
  title: ЯЕда — API для Telegram-бота
  version: 0.1.0
  description: >-
    Предложение контракта по задаче 303. Требует согласования с бэкендом.
    Бот обращается только к серверу команды. Демонстрационный сервер реализует
    эти операции на пяти тестовых рецептах. user_id — Telegram ID из события,
    полученного ботом. API доступен только доверенному серверу бота;
    перед публикацией команда должна согласовать и включить авторизацию.
servers:
  - url: http://127.0.0.1:8081
    description: Только локальная демонстрация
paths:
  /recipes:
    get:
      operationId: searchRecipes
      summary: Поиск по названию или ингредиентам
      description: >-
        query — название либо ингредиенты через запятую. Все перечисленные
        ингредиенты должны совпасть. Регистр и е/ё не учитываются.
        Нет результатов — 200 с пустым items. Морфология в демо не реализована.
      parameters:
        - name: query
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 300}
          example: яйца, помидор
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 20, default: 5}
      responses:
        '200':
          $ref: '#/components/responses/Recipes'
        '400':
          description: Некорректный запрос
  /users/{user_id}/favorites:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listFavorites
      summary: Избранные рецепты пользователя
      responses:
        '200':
          $ref: '#/components/responses/Recipes'
        '400':
          description: Некорректный ID пользователя
  /users/{user_id}/favorites/{recipe_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - name: recipe_id
        in: path
        required: true
        schema: {type: integer, format: int64, minimum: 1}
    put:
      operationId: saveFavorite
      summary: Сохранить рецепт; повторный запрос не создаёт дубликат
      responses:
        '200':
          description: Рецепт сохранён или уже был сохранён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteStatus'
              example: {saved: true}
        '400':
          description: Некорректные идентификаторы
        '404':
          description: Рецепт не существует
    delete:
      operationId: removeFavorite
      summary: Удалить из избранного; повторный запрос допустим
      responses:
        '200':
          description: Рецепта больше нет в избранном
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteStatus'
              example: {saved: false}
        '400':
          description: Некорректные идентификаторы
        '404':
          description: Рецепт не существует
components:
  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      schema: {type: integer, format: int64, minimum: 1}
      description: Telegram ID, полученный ботом из события, не введённый пользователем
  responses:
    Recipes:
      description: Список рецептов, возможно пустой
      content:
        application/json:
          schema:
            type: object
            required: [items]
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/Recipe'
  schemas:
    Recipe:
      type: object
      required: [id, title, ingredients, steps]
      properties:
        id: {type: integer, format: int64, minimum: 1}
        title: {type: string, minLength: 1}
        ingredients:
          type: array
          items: {type: string}
        steps:
          type: array
          items: {type: string}
      example:
        id: 1
        title: Омлет с помидором
        ingredients: ['яйца — 2 шт.', 'помидор — 1 шт.']
        steps: ['Нарежь помидор.', 'Добавь взбитые яйца и готовь до готовности.']
    FavoriteStatus:
      type: object
      required: [saved]
      properties:
        saved: {type: boolean}
